name: Deploy reservation-status-updater to AWS

on:
  push:
    branches: [main]
    paths:
      - 'reservation-status-updater/**'
      - '.github/workflows/deploy-reservation-status-updater.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_SSL: ${{ secrets.DATABASE_SSL }}
      NOTIFY_MODE: ${{ secrets.NOTIFY_MODE || 'log' }}
      API_NOTIFICATION: ${{ secrets.API_NOTIFICATION }}
      API_TOKEN_INTEGRATION: ${{ secrets.API_TOKEN_INTEGRATION }}
    defaults:
      run:
        working-directory: reservation-status-updater

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: reservation-status-updater/package-lock.json

      - name: Install deps (prod only)
        run: npm ci --omit=dev

      - name: Build zip (lo que hoy haces a mano)
        run: |
          zip -r ../status-function.zip . -x "*.git*" "*.DS_Store*" "node_modules/.cache/*"
          ls -lh ../status-function.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name "${{ secrets.LAMBDA_STATUS_FUNCTION_NAME }}" \
            --zip-file "fileb://../status-function.zip"

          aws lambda wait function-updated \
            --function-name "${{ secrets.LAMBDA_STATUS_FUNCTION_NAME }}"

      # OJO: `update-function-configuration` REEMPLAZA todas las env vars de la Lambda,
      # no solo una. Por eso aquí se escribe el set COMPLETO.
      - name: Update Lambda env
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          aws lambda update-function-configuration \
            --function-name "${{ secrets.LAMBDA_STATUS_FUNCTION_NAME }}" \
            --environment "Variables={DATABASE_URL=$DATABASE_URL,DATABASE_SSL=$DATABASE_SSL,NOTIFY_MODE=$NOTIFY_MODE,API_NOTIFICATION=$API_NOTIFICATION,API_TOKEN_INTEGRATION=$API_TOKEN_INTEGRATION}"
